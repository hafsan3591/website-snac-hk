<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — SNAC ANIME</title>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .admin-wrap { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }
    .admin-wrap h1 { font-size: 1.8rem; margin-bottom: 6px; }
    .admin-wrap .hint { color: var(--text-soft); margin-bottom: 24px; font-size: 0.9rem; }
    .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    @media (max-width: 820px) { .admin-grid { grid-template-columns: 1fr; } }
    .admin-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
    .admin-card h2 { font-size: 1.1rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .form-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
    .form-row label { font-size: 0.82rem; color: var(--text-soft); font-weight: 600; }
    .form-row input, .form-row select, .form-row textarea {
      background: var(--bg-soft); border: 1px solid var(--border); color: #fff;
      border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; outline: none; font-family: inherit;
    }
    .form-row input:focus, .form-row select:focus, .form-row textarea:focus { border-color: var(--primary); }
    .form-row textarea { resize: vertical; min-height: 70px; }
    .form-row .checkline { display: flex; gap: 16px; flex-wrap: wrap; }
    .form-row .checkline label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--text-soft); text-transform: none; font-weight: 400; }
    .form-row .checkline input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--primary); }
    .admin-actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .admin-actions .btn { padding: 10px 18px; font-size: 0.88rem; }
    .login-box { max-width: 380px; margin: 80px auto; text-align: center; }
    .login-box input { width: 100%; margin-bottom: 12px; }
    .login-box .btn { width: 100%; }
    .msg { font-size: 0.85rem; margin-top: 10px; min-height: 1.2em; }
    .msg.ok { color: #34d399; }
    .msg.err { color: #f87171; }
    .admin-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; margin-top: 10px; }
    .admin-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; background: var(--bg-soft);
      border: 1px solid var(--border); border-radius: 10px;
      font-size: 0.85rem;
    }
    .admin-item .ai-title { flex: 1; font-weight: 600; }
    .admin-item .ai-meta { color: var(--text-soft); font-size: 0.78rem; }
    .admin-item button { padding: 6px 10px; border-radius: 8px; font-size: 0.75rem; }
    .ai-badge { font-size: 0.65rem; padding: 2px 7px; border-radius: 999px; background: rgba(225,29,72,0.2); color: #ff7b95; }
    .ai-badge.custom { background: rgba(124,58,237,0.25); color: #c4b5fd; }
    .ai-badge.base { background: rgba(52,211,153,0.2); color: #6ee7b7; }
    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar input { flex: 1; min-width: 180px; }
    code { background: var(--bg-soft); padding: 2px 6px; border-radius: 6px; font-size: 0.8rem; }
  </style>
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a href="index.html" class="logo"><span class="logo-mark">S</span><span class="logo-text">SNAC <span>ANIME</span></span></a>
      <div class="nav-actions"><a href="index.html" class="btn btn-ghost" style="padding:9px 18px;font-size:0.85rem;">← সাইটে ফিরুন</a></div>
    </div>
  </header>

  <main class="admin-wrap">
    <!-- LOGIN -->
    <div id="loginView">
      <div class="login-box">
        <h1>🔐 Admin Login</h1>
        <p class="hint">পাসওয়ার্ড দিন (ডিফল্ট: <code>snac-admin</code>)</p>
        <input type="password" id="adminPass" placeholder="পাসওয়ার্ড" />
        <button class="btn btn-primary" id="loginBtn">লগইন</button>
        <div class="msg" id="loginMsg"></div>
      </div>
    </div>

    <!-- PANEL -->
    <div id="panelView" style="display:none;">
      <h1>⚙️ Admin Panel</h1>
      <p class="hint">এখান থেকে Anime যোগ, এডিট বা ডিলিট করতে পারবেন। ডেটা ব্রাউজারের localStorage-এ সেভ হয়।</p>

      <div class="admin-grid">
        <!-- FORM -->
        <div class="admin-card">
          <h2 id="formTitle">➕ নতুন Anime যোগ করুন</h2>
          <form id="animeForm">
            <input type="hidden" id="editId" value="" />
            <div class="form-row"><label>ID (ইংরেজি, ইউনিক) *</label><input id="fId" placeholder="e.g. one-piece" required /></div>
            <div class="form-row"><label>Title *</label><input id="fTitle" required /></div>
            <div class="form-row"><label>Title (বাংলা)</label><input id="fTitleBn" /></div>
            <div class="form-row"><label>Genre (কমা দিয়ে) *</label><input id="fGenre" placeholder="Action, Fantasy" required /></div>
            <div class="form-row"><label>Year *</label><input id="fYear" type="number" min="1900" max="2100" required /></div>
            <div class="form-row"><label>Language</label>
              <select id="fLanguage">
                <option value="Hindi Dubbed">Hindi Dubbed</option>
                <option value="Subtitle">Subtitle</option>
              </select>
            </div>
            <div class="form-row"><label>Status</label>
              <select id="fStatus">
                <option value="Ongoing">Ongoing</option>
                <option value="Completed">Completed</option>
                <option value="Movie">Movie</option>
              </select>
            </div>
            <div class="form-row"><label>Rating (0-10)</label><input id="fRating" type="number" step="0.1" min="0" max="10" value="8" /></div>
            <div class="form-row"><label>Poster URL (অপশনাল)</label><input id="fPoster" placeholder="https://..." /></div>
            <div class="form-row"><label>Description</label><textarea id="fDesc"></textarea></div>
            <div class="form-row"><label>Telegram Post URL (অপশনাল)</label><input id="fTelegram" placeholder="https://t.me/SNAC_hindi_anime/123" /></div>
            <div class="form-row"><label>ফ্ল্যাগ</label>
              <div class="checkline">
                <label><input type="checkbox" id="fTrending" /> Trending</label>
                <label><input type="checkbox" id="fLatest" /> Latest</label>
              </div>
            </div>
            <div class="admin-actions">
              <button type="submit" class="btn btn-primary" id="saveBtn">💾 সেভ করুন</button>
              <button type="button" class="btn btn-ghost" id="resetBtn">রিসেট</button>
            </div>
            <div class="msg" id="formMsg"></div>
          </form>
        </div>

        <!-- LIST -->
        <div class="admin-card">
          <h2>📋 Anime তালিকা</h2>
          <div class="toolbar">
            <input type="search" id="adminSearch" placeholder="সার্চ..." />
            <button class="btn btn-ghost" id="exportBtn" style="padding:9px 14px;font-size:0.82rem;">⬇ Export</button>
            <button class="btn btn-ghost" id="importBtn" style="padding:9px 14px;font-size:0.82rem;">⬆ Import</button>
            <input type="file" id="importFile" accept=".json" style="display:none;" />
          </div>
          <div class="admin-list" id="adminList"></div>
          <div class="msg" id="listMsg"></div>
        </div>
      </div>

      <div class="admin-actions" style="margin-top:24px;">
        <button class="btn btn-ghost" id="logoutBtn">🚪 লগআউট</button>
        <button class="btn btn-ghost" id="clearCustomBtn" style="color:#f87171;">🗑 সব কাস্টম ডেটা মুছুন</button>
      </div>
    </div>
  </main>

  <script src="anime-data.js"></script>
  <script src="admin.js"></script>
</body>
</html>
